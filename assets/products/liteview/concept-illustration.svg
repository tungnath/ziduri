<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="lvTitle">
  <title id="lvTitle">Illustration of the LiteView window: a toolbar, an image viewport, a filmstrip and a status bar</title>
  <defs>
    <linearGradient id="lvWin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1c28"/>
      <stop offset="100%" stop-color="#15151f"/>
    </linearGradient>
    <linearGradient id="lvIcon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f9cf9"/>
      <stop offset="100%" stop-color="#9b59b6"/>
    </linearGradient>
    <pattern id="lvChecker" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#20202c"/>
      <rect width="10" height="10" fill="#262632"/>
      <rect x="10" y="10" width="10" height="10" fill="#262632"/>
    </pattern>
  </defs>

  <!-- window -->
  <rect x="16" y="16" width="608" height="368" rx="14" fill="url(#lvWin)" stroke="#2a2a38"/>

  <!-- title bar -->
  <rect x="16" y="16" width="608" height="34" rx="14" fill="#1a1a24"/>
  <circle cx="38" cy="33" r="5" fill="#e0605e"/>
  <circle cx="56" cy="33" r="5" fill="#f0b429"/>
  <circle cx="74" cy="33" r="5" fill="#43b581"/>
  <text x="320" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9aa1ad">LiteView — sunset-gradient.avif</text>

  <!-- toolbar -->
  <rect x="16" y="50" width="608" height="30" fill="#1f1f2b"/>
  <text x="36" y="70" font-family="Arial, sans-serif" font-size="11" fill="#9aa1ad">Folder</text>
  <text x="100" y="70" font-family="Arial, sans-serif" font-size="11" fill="#9aa1ad">◀ ▶</text>
  <text x="150" y="70" font-family="Arial, sans-serif" font-size="11" fill="#9aa1ad">− 100% +</text>
  <text x="230" y="70" font-family="Arial, sans-serif" font-size="11" fill="#9aa1ad">Fit · 1:1 · ↻</text>
  <text x="320" y="70" font-family="Arial, sans-serif" font-size="11" fill="#9aa1ad">▦ Grid</text>

  <!-- viewport -->
  <rect x="16" y="80" width="608" height="230" fill="url(#lvChecker)"/>
  <g transform="translate(258,116)">
    <rect width="124" height="124" rx="26" fill="url(#lvIcon)"/>
    <circle cx="88" cy="40" r="14" fill="#ffd166"/>
    <path d="M4 120 4 100 48 56 84 96 84 120Z" fill="#fff" opacity="0.95"/>
    <path d="M62 120 92 84 120 112 120 120Z" fill="#fff" opacity="0.72"/>
  </g>

  <!-- filmstrip -->
  <rect x="16" y="310" width="608" height="56" fill="#1a1a24"/>
  <g>
    <rect x="32" y="322" width="64" height="32" rx="4" fill="url(#lvIcon)" stroke="#4f9cf9" stroke-width="2"/>
    <rect x="104" y="322" width="64" height="32" rx="4" fill="#c96ad0" opacity="0.6"/>
    <rect x="176" y="322" width="64" height="32" rx="4" fill="#5ad0c2" opacity="0.6"/>
    <rect x="248" y="322" width="64" height="32" rx="4" fill="#f0937a" opacity="0.6"/>
    <rect x="320" y="322" width="64" height="32" rx="4" fill="#43b581" opacity="0.6"/>
  </g>

  <!-- status bar -->
  <rect x="16" y="366" width="608" height="18" fill="#1a1a24"/>
  <text x="30" y="378" font-family="Arial, sans-serif" font-size="10" fill="#767690">sunset-gradient.avif · 1 / 7 · 1600 × 1000 · 52.4 KB</text>
  <text x="580" y="378" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#767690">70%</text>
</svg>
