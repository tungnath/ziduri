<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="ephTitle">
  <title id="ephTitle">Illustration of the Ephemera start screen: a dark room with a Create Room panel and a room-code join field</title>
  <defs>
    <linearGradient id="ephBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d1526"/>
      <stop offset="100%" stop-color="#280d18"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="608" height="368" rx="14" fill="url(#ephBg)"/>

  <text x="56" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="#fffaf7">Ephemera</text>
  <text x="56" y="120" font-family="Arial, sans-serif" font-size="12" letter-spacing="2" fill="#d4a24e">EPHEMERAL ROOMS</text>

  <g transform="translate(356,110)">
    <rect width="230" height="180" rx="14" fill="#fffaf7" fill-opacity="0.94"/>
    <text x="18" y="34" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#32121d">No room yet?</text>
    <text x="18" y="52" font-family="Arial, sans-serif" font-size="10" fill="#766873">Create a new room and share the link.</text>
    <rect x="18" y="64" width="194" height="30" rx="8" fill="#4a1c2b"/>
    <text x="115" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fffaf7">Create Room</text>

    <line x1="18" y1="110" x2="212" y2="110" stroke="#e6dcd8" stroke-width="1"/>

    <text x="18" y="130" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#32121d">Already have a code?</text>
    <text x="18" y="146" font-family="Arial, sans-serif" font-size="9" fill="#766873">Room code</text>
    <rect x="18" y="152" width="130" height="26" rx="7" fill="#ffffff" stroke="#ddd4d7"/>
    <text x="26" y="169" font-family="Arial, sans-serif" font-size="11" fill="#9a8f93">abc123</text>
    <rect x="154" y="152" width="58" height="26" rx="7" fill="#32121d"/>
    <text x="183" y="169" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fffaf7">Join</text>
  </g>
</svg>
