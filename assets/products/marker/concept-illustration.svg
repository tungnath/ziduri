<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="mkTitle">
  <title id="mkTitle">Illustration of the Marker window: a file sidebar, a View/Edit/Split toolbar, and a split pane showing markdown source next to its rendered preview</title>
  <defs>
    <linearGradient id="mkWin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1c28"/>
      <stop offset="100%" stop-color="#15151f"/>
    </linearGradient>
  </defs>

  <!-- window -->
  <rect x="16" y="16" width="608" height="368" rx="14" fill="url(#mkWin)" stroke="#2a2a38"/>

  <!-- title bar -->
  <rect x="16" y="16" width="608" height="34" rx="14" fill="#1a1a24"/>
  <circle cx="38" cy="33" r="5" fill="#e0605e"/>
  <circle cx="56" cy="33" r="5" fill="#f0b429"/>
  <circle cx="74" cy="33" r="5" fill="#43b581"/>
  <text x="320" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9aa1ad">Marker — ARCHITECTURE.md</text>

  <!-- toolbar -->
  <rect x="16" y="50" width="608" height="30" fill="#1f1f2b"/>
  <rect x="30" y="57" width="130" height="16" rx="8" fill="#2a2a38"/>
  <rect x="30" y="57" width="43" height="16" rx="8" fill="#6c63ff"/>
  <text x="51" y="69" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">View</text>
  <text x="95" y="69" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#9aa1ad">Edit</text>
  <text x="138" y="69" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#9aa1ad">Split</text>
  <text x="596" y="69" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#767690">☾</text>

  <!-- sidebar -->
  <rect x="16" y="80" width="150" height="286" fill="#191922"/>
  <text x="32" y="102" font-family="Arial, sans-serif" font-size="10" fill="#767690" letter-spacing="1">MDIDE-NOTES</text>
  <rect x="24" y="116" width="134" height="26" rx="6" fill="#262638"/>
  <text x="34" y="133" font-family="Arial, sans-serif" font-size="11" fill="#e5e5ee">README.md</text>
  <rect x="24" y="148" width="134" height="26" rx="6" fill="#6c63ff" opacity="0.22"/>
  <text x="34" y="165" font-family="Arial, sans-serif" font-size="11" fill="#c9c5ff">ARCHITECTURE.md</text>
  <text x="34" y="197" font-family="Arial, sans-serif" font-size="11" fill="#9aa1ad">TECHNICAL_DESIGN.md</text>
  <text x="34" y="229" font-family="Arial, sans-serif" font-size="11" fill="#9aa1ad">CHANGELOG.md</text>

  <!-- split: source pane -->
  <rect x="166" y="80" width="229" height="286" fill="#14141c"/>
  <text x="182" y="104" font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#767690"># Architecture</text>
  <text x="182" y="126" font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#9aa1ad">High-level shape of the app:</text>
  <text x="182" y="146" font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#c9c5ff">what runs where, how the</text>
  <text x="182" y="166" font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#c9c5ff">pieces talk to each other.</text>
  <text x="182" y="196" font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#767690">## Data flow</text>
  <text x="182" y="218" font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#e5605e">- read()</text>
  <text x="182" y="238" font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#43b581">- save(content)</text>
  <rect x="182" y="250" width="2" height="14" fill="#6c63ff"/>

  <!-- split: preview pane -->
  <rect x="395" y="80" width="229" height="286" fill="#101018"/>
  <text x="411" y="112" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#f2f2f7">Architecture</text>
  <text x="411" y="136" font-family="Arial, sans-serif" font-size="10" fill="#c2c2cf">High-level shape of the app:</text>
  <text x="411" y="152" font-family="Arial, sans-serif" font-size="10" fill="#c2c2cf">what runs where, how the</text>
  <text x="411" y="168" font-family="Arial, sans-serif" font-size="10" fill="#c2c2cf">pieces talk to each other.</text>
  <text x="411" y="196" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f2f2f7">Data flow</text>
  <rect x="411" y="206" width="188" height="46" rx="6" fill="#1a1a24" stroke="#2a2a38"/>
  <text x="421" y="224" font-family="ui-monospace, Consolas, monospace" font-size="9" fill="#e5605e">- read()</text>
  <text x="421" y="240" font-family="ui-monospace, Consolas, monospace" font-size="9" fill="#43b581">- save(content)</text>

  <!-- status bar -->
  <rect x="16" y="366" width="608" height="18" fill="#1a1a24"/>
  <text x="30" y="378" font-family="Arial, sans-serif" font-size="10" fill="#767690">ARCHITECTURE.md · Split · saved</text>
  <text x="580" y="378" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#767690">GFM</text>
</svg>
